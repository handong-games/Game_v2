<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="860" viewBox="0 0 1180 860">
  <defs>
    <style>
      .title { font: 700 20px sans-serif; fill: #202020; }
      .h { font: 700 15px sans-serif; fill: #202020; }
      .t { font: 13px sans-serif; fill: #444; }
      .tiny { font: 11px sans-serif; fill: #666; }
      .panel { fill: #fbfaf5; stroke: #d6cfbd; stroke-width: 1.5; }
      .deck { fill: #e9d6aa; stroke: #7f6843; stroke-width: 2; }
      .top { fill: #fff0c4; stroke: #c6903e; stroke-width: 2.5; }
      .card { fill: #fff4ce; stroke: #b97a42; stroke-width: 2.5; }
      .ghost { fill: #fff4ce; stroke: #b97a42; stroke-width: 2; stroke-dasharray: 6 5; opacity: .42; }
      .target { fill: none; stroke: #8e8e8e; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .path { fill: none; stroke: #2f78c4; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .soft { fill: none; stroke: #2f78c4; stroke-width: 2; stroke-dasharray: 6 6; opacity: .55; marker-end: url(#arrow); }
      .impact { stroke: #d24a35; stroke-width: 3; stroke-linecap: round; }
      .note { fill: #edf5ff; stroke: #b7cbe7; stroke-width: 1; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f78c4"/>
    </marker>
  </defs>

  <rect width="1180" height="860" fill="#f4f1e8"/>
  <text x="34" y="38" class="title">Adventure card deal motion options</text>
  <text x="34" y="62" class="t">Common rule: deck is above, board destination is below, deck remains visible, destination anchor stays fixed.</text>

  <!-- row 1: feel -->
  <text x="34" y="104" class="h">2. Deal feeling</text>

  <g transform="translate(34 120)">
    <rect width="350" height="210" rx="8" class="panel"/>
    <text x="18" y="26" class="h">A. Soft push</text>
    <text x="18" y="46" class="tiny">Slow, readable, gentle.</text>
    <g transform="translate(48 62)">
      <rect x="22" y="0" width="70" height="98" rx="7" class="deck"/>
      <rect x="14" y="-8" width="70" height="98" rx="7" class="top"/>
      <rect x="214" y="94" width="82" height="116" rx="8" class="ghost"/>
      <path d="M49 40 C90 80, 154 116, 255 152" class="path"/>
      <rect x="126" y="92" width="64" height="90" rx="7" class="card" opacity=".55"/>
    </g>
    <text x="18" y="194" class="tiny">Best when intro should feel calm.</text>
  </g>

  <g transform="translate(414 120)">
    <rect width="350" height="210" rx="8" class="panel"/>
    <text x="18" y="26" class="h">B. Quick slide</text>
    <text x="18" y="46" class="tiny">Fast, sharp, dealer-like.</text>
    <g transform="translate(48 62)">
      <rect x="22" y="0" width="70" height="98" rx="7" class="deck"/>
      <rect x="14" y="-8" width="70" height="98" rx="7" class="top"/>
      <rect x="214" y="94" width="82" height="116" rx="8" class="ghost"/>
      <path d="M49 40 L255 152" class="path"/>
      <line x1="94" y1="64" x2="128" y2="82" class="soft"/>
      <line x1="126" y1="82" x2="164" y2="103" class="soft"/>
    </g>
    <text x="18" y="194" class="tiny">Best for snappy card dealing.</text>
  </g>

  <g transform="translate(794 120)">
    <rect width="350" height="210" rx="8" class="panel"/>
    <text x="18" y="26" class="h">C. Pull then place</text>
    <text x="18" y="46" class="tiny">Short extraction, then exact placement.</text>
    <g transform="translate(48 62)">
      <rect x="22" y="0" width="70" height="98" rx="7" class="deck"/>
      <rect x="14" y="-8" width="70" height="98" rx="7" class="top"/>
      <rect x="214" y="94" width="82" height="116" rx="8" class="ghost"/>
      <path d="M49 40 L70 56" class="soft"/>
      <path d="M70 56 L255 152" class="path"/>
      <rect x="58" y="48" width="50" height="70" rx="6" class="card" opacity=".48"/>
    </g>
    <text x="18" y="194" class="tiny">Best when extraction should be visible.</text>
  </g>

  <!-- row 2: overlap -->
  <text x="34" y="374" class="h">3. How the top card leaves the deck</text>

  <g transform="translate(34 390)">
    <rect width="540" height="210" rx="8" class="panel"/>
    <text x="18" y="26" class="h">A. Starts almost overlapped with deck</text>
    <text x="18" y="46" class="tiny">Top card begins exactly on the deck. It reads as the deck's top card.</text>
    <g transform="translate(72 70)">
      <rect x="24" y="8" width="84" height="116" rx="8" class="deck"/>
      <rect x="18" y="2" width="84" height="116" rx="8" class="deck"/>
      <rect x="12" y="-4" width="84" height="116" rx="8" class="top"/>
      <path d="M54 54 L220 146" class="path"/>
      <rect x="306" y="102" width="94" height="132" rx="8" class="ghost"/>
    </g>
    <text x="18" y="194" class="tiny">Cleaner for 'top card flies away'. User-selected direction fits this.</text>
  </g>

  <g transform="translate(604 390)">
    <rect width="540" height="210" rx="8" class="panel"/>
    <text x="18" y="26" class="h">B. Starts already peeking out</text>
    <text x="18" y="46" class="tiny">Top card is pre-offset under the deck before motion starts.</text>
    <g transform="translate(72 70)">
      <rect x="24" y="8" width="84" height="116" rx="8" class="deck"/>
      <rect x="18" y="2" width="84" height="116" rx="8" class="deck"/>
      <rect x="42" y="24" width="84" height="116" rx="8" class="top"/>
      <path d="M84 82 L220 146" class="path"/>
      <rect x="306" y="102" width="94" height="132" rx="8" class="ghost"/>
    </g>
    <text x="18" y="194" class="tiny">More readable, but less like the actual top card is being dealt.</text>
  </g>

  <!-- row 3: landing -->
  <text x="34" y="644" class="h">4. Landing behavior</text>

  <g transform="translate(34 660)">
    <rect width="350" height="160" rx="8" class="panel"/>
    <text x="18" y="26" class="h">A. Stop exactly</text>
    <text x="18" y="46" class="tiny">Card reaches destination and stops.</text>
    <rect x="206" y="42" width="82" height="116" rx="8" class="ghost"/>
    <path d="M76 50 L247 100" class="path"/>
    <rect x="206" y="42" width="82" height="116" rx="8" class="card"/>
    <text x="18" y="142" class="tiny">Most stable and least noisy.</text>
  </g>

  <g transform="translate(414 660)">
    <rect width="350" height="160" rx="8" class="panel"/>
    <text x="18" y="26" class="h">B. Tiny press</text>
    <text x="18" y="46" class="tiny">Card lands, moves 1-2px down, returns.</text>
    <rect x="206" y="42" width="82" height="116" rx="8" class="ghost"/>
    <path d="M76 50 L247 100" class="path"/>
    <line x1="220" y1="154" x2="274" y2="154" class="impact"/>
    <line x1="232" y1="160" x2="262" y2="160" class="impact" opacity=".45"/>
    <text x="18" y="142" class="tiny">Sells the 'placed on board' feeling.</text>
  </g>

  <g transform="translate(794 660)">
    <rect width="350" height="160" rx="8" class="panel"/>
    <text x="18" y="26" class="h">C. Scale settle</text>
    <text x="18" y="46" class="tiny">Card lands at 0.98 scale, then returns to 1.0.</text>
    <rect x="206" y="42" width="82" height="116" rx="8" class="ghost"/>
    <path d="M76 50 L247 100" class="path"/>
    <rect x="211" y="48" width="72" height="104" rx="8" class="card" opacity=".55"/>
    <rect x="206" y="42" width="82" height="116" rx="8" class="card" opacity=".28"/>
    <text x="18" y="142" class="tiny">Polished but can feel gamey.</text>
  </g>
</svg>
